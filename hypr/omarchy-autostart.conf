# Note: This is a local copy of Omarchy's stock autostart with an absolute monitor watcher wrapper.

exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- mako
exec-once = ! omarchy-toggle-enabled waybar-off && uwsm-app -- waybar
exec-once = uwsm-app -- fcitx5 --disable notificationitem
exec-once = uwsm-app -- swaybg -i ~/.config/omarchy/current/background -m fill
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = omarchy-first-run
exec-once = omarchy-powerprofiles-init

# uwsm-app can start this before Omarchy's bin path is imported, so use a wrapper with a stable path.
exec-once = uwsm-app -- /home/norlys/.config/hypr/scripts/omarchy-hyprland-monitor-watch

# Slow app launch fix -- set systemd vars
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# Run post-boot hooks after startup config has loaded
exec-once = sleep 2 && omarchy-hook post-boot
